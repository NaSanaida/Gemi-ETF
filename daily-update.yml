name: 미국 ETF·주식·환율·뉴스 자동 최신화 (15분 간격)

on:
  schedule:
    # 매일 15분마다 실시간 환율(KRW=X)·ETF 24종·미국주식 20종·최신 뉴스 자동 갱신 (공개 저장소 무료)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 실시간 시장·환율·거시·다매체 뉴스 요약본 수집
        run: node scripts/update-data.mjs

      - name: 최신 데이터 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Gemini Econ Bot"
          git add data/market-data.json data/market-data.js
          git diff --staged --quiet || git commit -m "chore: 시세·환율·뉴스 자동 최신화 ($(date +'%Y-%m-%d %H:%M UTC'))"
          git push
