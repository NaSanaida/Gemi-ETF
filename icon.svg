<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1324"/>
      <stop offset="55%" stop-color="#13223F"/>
      <stop offset="100%" stop-color="#1A3363"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="barLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- 딥 미드나잇 네이비 베이스 (안드로이드/iOS maskable 여백 완벽 대응) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- 은은한 상단 빛 반사 -->
  <circle cx="140" cy="110" r="190" fill="#3182F6" opacity="0.12"/>

  <!-- 미니멀 3단 금융 상승 바 (Safe Zone 128~384 중앙 배치) -->
  <rect x="136" y="276" width="54" height="106" rx="16" fill="#3182F6" opacity="0.58"/>
  <rect x="229" y="218" width="54" height="164" rx="16" fill="url(#barBlue)"/>
  <rect x="322" y="150" width="54" height="232" rx="16" fill="url(#barLight)"/>

  <!-- 절제된 상승 곡선 아크 + 포인트 1개 -->
  <path d="M138 232 C196 220, 250 184, 304 128" fill="none" stroke="url(#arcGrad)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="349" cy="126" r="14" fill="#3182F6" stroke="#FFFFFF" stroke-width="6"/>
</svg>
